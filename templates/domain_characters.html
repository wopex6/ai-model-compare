<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Companion - Domain Characters</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='domain_characters.css') }}" rel="stylesheet">
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --coordinator-color: #ffc107;
        }
        
        body {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .domain-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .domain-header {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
            position: relative;
        }
        
        .header-nav {
            position: absolute;
            top: 15px;
            left: 20px;
        }
        
        .back-to-dashboard {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .back-to-dashboard:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            color: white;
            text-decoration: none;
        }
        
        .domain-header h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        
        .domain-header p {
            color: #666;
            font-size: 1.1rem;
        }
        
        .chat-section {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            height: calc(100vh - 200px);
        }
        
        .characters-sidebar {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            position: sticky;
            top: 20px;
            height: fit-content;
            max-height: calc(100vh - 220px);
            overflow-y: auto;
            align-self: start;
        }
        
        .sidebar-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }
        
        .main-chat {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 220px);
            max-height: calc(100vh - 220px);
        }
        
        .chat-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .chat-header .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .chat-header .info h3 {
            margin: 0;
            font-size: 1.2rem;
        }
        
        .chat-header .info p {
            margin: 0;
            font-size: 0.85rem;
            opacity: 0.9;
        }
        
        .chat-messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 20px;
            background: linear-gradient(to bottom, #fafafa, #ffffff);
        }
        
        .message {
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            text-align: right;
        }
        
        .message.user .bubble {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            display: inline-block;
            padding: 12px 18px;
            border-radius: 18px 18px 5px 18px;
            max-width: 70%;
        }
        
        .message.bot .bubble {
            background: #f0f0f0;
            display: inline-block;
            padding: 12px 18px;
            border-radius: 18px 18px 18px 5px;
            max-width: 70%;
        }
        
        .chat-input-area {
            padding: 20px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
            flex-shrink: 0;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
        }
        
        .input-group input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .input-group button {
            padding: 12px 25px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .analysis-toggle {
            margin-top: 15px;
        }
        
        .analysis-toggle label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #666;
        }
        
        @media (max-width: 992px) {
            .chat-section {
                grid-template-columns: 1fr;
            }
            
            .characters-sidebar {
                max-height: none;
            }
        }
    </style>
</head>
<body>
    <div class="domain-container">
        <!-- Header -->
        <div class="domain-header">
            <div class="header-nav">
                <a href="/chatchat" class="back-to-dashboard">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>
            <h1><i class="fas fa-users"></i> Life Companion</h1>
            <p>Your multi-domain AI advisors - specialized guidance across all areas of life</p>
        </div>
        
        <!-- Chat Section -->
        <div class="chat-section">
            <!-- Characters Sidebar -->
            <div class="characters-sidebar">
                <div class="sidebar-title">
                    <i class="fas fa-user-friends"></i> Domain Advisors
                </div>
                <div id="domain-character-list" class="domain-character-list">
                    <!-- Characters loaded dynamically -->
                    <div class="loading-chars">
                        <i class="fas fa-spinner fa-spin"></i> Loading characters...
                    </div>
                </div>
                
                <!-- Analysis Panel (optional) -->
                <div id="character-analysis-panel" class="character-analysis-panel" style="display: none;">
                    <!-- Analysis rendered dynamically -->
                </div>
            </div>
            
            <!-- Main Chat -->
            <div class="main-chat">
                <div class="chat-header">
                    <div class="avatar">
                        <i class="fas fa-star"></i>
                    </div>
                    <div class="info">
                        <h3 id="selected-domain-character">Aria</h3>
                        <p id="selected-character-domain">Coordinator - Sees the bigger picture</p>
                    </div>
                </div>
                
                <div id="domain-chat-messages" class="chat-messages">
                    <!-- Messages loaded dynamically per character -->
                </div>
                
                <div class="chat-input-area">
                    <div class="input-group">
                        <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off">
                        <button id="sendBtn"><i class="fas fa-paper-plane"></i> Send</button>
                    </div>
                    <div class="analysis-toggle">
                        <label>
                            <input type="checkbox" id="showAnalysis"> Show character analysis
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="{{ url_for('static', filename='auth_helper.js') }}"></script>
    <script src="{{ url_for('static', filename='message_handler.js') }}"></script>
    <script src="{{ url_for('static', filename='conversation_box.js') }}"></script>
    <script src="{{ url_for('static', filename='domain_characters.js') }}"></script>
    <script>
        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', async function() {
            // Initialize MessageHandler first (use domain-chat-messages container)
            MessageHandler.init('domain-characters', {
                characterDisplayName: 'Aria'
            });
            // Override container since domain uses different ID
            MessageHandler.messagesContainer = document.getElementById('domain-chat-messages');
            
            // Initialize DomainCharacters directly (simpler approach)
            await DomainCharacters.init({
                ui: {
                    characterListId: 'domain-character-list',
                    selectedCharacterId: 'selected-domain-character',
                    analysisPanelId: 'character-analysis-panel'
                }
            });
            
            // Load initial character (coordinator) history
            await DomainCharacters.loadCharacterHistory('coordinator');
            
            // Initialize search functionality (uses ConversationBox search UI)
            ConversationBox.initSearchOnly();
            
            // Handle send button
            document.getElementById('sendBtn').addEventListener('click', async function() {
                const input = document.getElementById('userInput');
                const message = input.value.trim();
                if (message) {
                    input.value = '';
                    await DomainCharacters.sendMessage(message, true);
                }
            });
            
            // Handle Enter key
            document.getElementById('userInput').addEventListener('keypress', async function(e) {
                if (e.key === 'Enter') {
                    const message = this.value.trim();
                    if (message) {
                        this.value = '';
                        await DomainCharacters.sendMessage(message, true);
                    }
                }
            });
            
            // Handle analysis toggle
            document.getElementById('showAnalysis').addEventListener('change', function(e) {
                const panel = document.getElementById('character-analysis-panel');
                panel.style.display = e.target.checked ? 'block' : 'none';
            });
            
            console.log('✅ Domain Characters page initialized');
        });
    </script>
</body>
</html>
