<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Companion - Domain Characters</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='domain_characters.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='responsive.css') }}" rel="stylesheet">
    <!-- PWA Support -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --coordinator-color: #ffc107;
        }
        
        body {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .domain-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .domain-header {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
            position: relative;
        }
        
        .header-nav {
            position: absolute;
            top: 15px;
            left: 20px;
        }
        
        .back-to-dashboard {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .back-to-dashboard:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            color: white;
            text-decoration: none;
        }
        
        .domain-header h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        
        .domain-header p {
            color: #666;
            font-size: 1.1rem;
        }
        
        .chat-section {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 15px;
            height: calc(100vh - 80px);
        }
        
        .characters-sidebar {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            position: sticky;
            top: 10px;
            height: fit-content;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            align-self: start;
        }
        
        .sidebar-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }
        
        .main-chat {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 100px);
            max-height: calc(100vh - 100px);
        }
        
        .chat-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .chat-header .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .chat-header .info h3 {
            margin: 0;
            font-size: 1.2rem;
        }
        
        .chat-header .info p {
            margin: 0;
            font-size: 0.85rem;
            opacity: 0.9;
        }
        
        .chat-messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 20px;
            background: linear-gradient(to bottom, #fafafa, #ffffff);
        }
        
        .message {
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            text-align: right;
        }
        
        .message.user .bubble {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            display: inline-block;
            padding: 12px 18px;
            border-radius: 18px 18px 5px 18px;
            max-width: 70%;
        }
        
        .message.bot .bubble {
            background: #f0f0f0;
            display: inline-block;
            padding: 12px 18px;
            border-radius: 18px 18px 18px 5px;
            max-width: 70%;
        }
        
        .chat-input-area {
            padding: 20px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
            flex-shrink: 0;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
        }
        
        .input-group input,
        .input-group textarea {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            font-family: inherit;
            font-size: inherit;
            border-radius: 25px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        
        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .input-group button {
            padding: 12px 25px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .analysis-toggle {
            margin-top: 15px;
        }
        
        .analysis-toggle label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #666;
        }
        
        /* Header Action Buttons */
        .header-action-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            transition: background 0.2s, transform 0.2s;
        }
        
        .header-action-btn:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-1px);
        }
        
        .header-action-btn.active {
            background: rgba(255, 255, 255, 0.4);
        }
        
        /* Action Panels (Pinned, Highlights) */
        .action-panel {
            background: white;
            border-bottom: 1px solid #eee;
            padding: 15px;
            max-height: 250px;
            overflow-y: auto;
        }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .panel-header h4 {
            margin: 0;
            font-size: 0.95rem;
            color: #333;
        }
        
        .panel-close {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        
        .panel-close:hover {
            opacity: 1;
        }
        
        .panel-empty {
            color: #888;
            text-align: center;
            padding: 10px;
            margin: 0;
        }
        
        .panel-item {
            background: #f5f5f5;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            position: relative;
            border-left: 3px solid #667eea;
        }
        
        .panel-item.user-item {
            background: linear-gradient(135deg, #667eea22, #764ba222);
        }
        
        /* ============ MOBILE RESPONSIVE ============ */
        
        /* Tablet and below */
        @media (max-width: 992px) {
            .chat-section {
                display: flex;
                flex-direction: column;
                height: calc(100vh - 70px);
            }
            
            .characters-sidebar {
                max-height: 150px;
                overflow-y: auto;
                position: relative;
                top: 0;
                flex-shrink: 0;
            }
            
            .header-actions {
                flex-wrap: wrap;
            }
            
            .main-chat {
                flex: 1;
                min-height: 0;
            }
        }
        
        /* Mobile phones */
        @media (max-width: 767px) {
            .domain-container {
                padding: 10px;
                display: flex;
                flex-direction: column;
                height: 100vh;
                height: 100dvh;
            }
            
            .domain-header {
                padding: 10px 15px;
                border-radius: 12px;
                margin-bottom: 8px;
                flex-shrink: 0;
            }
            
            .domain-header h1 {
                font-size: 1.2rem;
                margin: 0;
            }
            
            .domain-header p {
                display: none; /* Hide subtitle on mobile */
            }
            
            .header-nav {
                position: relative;
                top: 0;
                left: 0;
                margin-bottom: 5px;
            }
            
            .back-to-dashboard {
                font-size: 0.8rem;
                padding: 5px 10px;
            }
            
            .chat-section {
                display: flex;
                flex-direction: column;
                gap: 8px;
                flex: 1;
                min-height: 0;
            }
            
            /* Sidebar becomes compact horizontal bar */
            .characters-sidebar {
                padding: 8px 10px;
                border-radius: 10px;
                flex-shrink: 0;
                order: 1;
                background: rgba(255, 255, 255, 0.95);
            }
            
            .sidebar-title {
                font-size: 0.75rem;
                margin-bottom: 6px;
                padding-bottom: 0;
                color: #666;
            }
            
            .domain-character-list {
                display: flex !important;
                flex-direction: row !important;
                flex-wrap: nowrap !important;
                gap: 6px;
                overflow-x: auto;
                overflow-y: hidden;
                padding-bottom: 2px;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }
            
            .domain-character-list::-webkit-scrollbar {
                display: none;
            }
            
            /* Character cards as icon-only buttons */
            .domain-character-list .character-card,
            .domain-character-list > div,
            .domain-char-item {
                flex-shrink: 0 !important;
                min-width: 44px !important;
                width: 44px !important;
                height: 44px !important;
                padding: 8px !important;
                border-radius: 12px !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
            }
            
            /* Hide text, show only icon */
            .domain-char-item .char-name,
            .domain-char-item .char-domain,
            .domain-character-list .char-name,
            .domain-character-list .char-domain {
                display: none !important;
            }
            
            .domain-char-item .char-icon {
                font-size: 1.4rem !important;
                display: block !important;
            }
            
            /* Main chat takes remaining space */
            .main-chat {
                border-radius: 12px;
                flex: 1;
                min-height: 0;
                order: 2;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            
            /* Compact chat header on mobile */
            .chat-header {
                padding: 8px 12px;
                gap: 8px;
                flex-shrink: 0;
            }
            
            .chat-header .avatar {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }
            
            .chat-header .info {
                flex: 1;
                min-width: 0;
            }
            
            .chat-header .info h3 {
                font-size: 0.9rem;
                margin: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            
            .chat-header .info p {
                font-size: 0.65rem;
                margin: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            
            .header-actions {
                gap: 4px;
                flex-shrink: 0;
            }
            
            .header-action-btn {
                padding: 5px 8px;
                font-size: 14px;
                min-height: 32px;
                min-width: 32px;
            }
            
            .header-action-btn span {
                font-size: 14px;
            }
            
            /* Action panels */
            .action-panel {
                max-height: 200px;
                padding: 10px;
            }
            
            .panel-header h4 {
                font-size: 0.85rem;
            }
            
            /* Chat messages - fix iOS scroll freeze */
            .chat-messages {
                padding: 10px;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                flex: 1;
                min-height: 0;
            }
            
            /* Chat input */
            .chat-input-area {
                padding: 10px;
                padding-bottom: calc(10px + env(safe-area-inset-bottom));
            }
            
            .input-group {
                gap: 8px;
            }
            
            .input-group textarea {
                padding: 10px 14px;
                font-size: 16px; /* Prevents iOS zoom */
                border-radius: 20px;
            }
            
            .input-group button {
                padding: 10px 18px;
                border-radius: 20px;
                font-size: 0.9rem;
            }
            
            .analysis-toggle {
                margin-top: 10px;
            }
            
            .analysis-toggle label {
                font-size: 0.8rem;
            }
        }
        
        /* Small phones (iPhone SE, etc) */
        @media (max-width: 375px) {
            .domain-header h1 {
                font-size: 1rem;
            }
            
            .chat-header .info h3 {
                font-size: 0.85rem;
            }
            
            .chat-header .info p {
                font-size: 0.6rem;
            }
            
            .header-action-btn {
                padding: 4px 6px;
                font-size: 12px;
                min-height: 28px;
                min-width: 28px;
            }
            
            /* Icons only on very small screens */
            .header-action-btn span:not(:first-child) {
                display: none;
            }
            
            .domain-character-list .character-card,
            .domain-character-list > div {
                padding: 6px !important;
                font-size: 0.65rem !important;
            }
            
            .domain-char-item .char-name,
            .domain-char-item .char-domain {
                display: none !important;
            }
            
            .domain-char-item .char-icon {
                font-size: 1.2rem !important;
            }
        }
        
        /* Landscape mode on phones */
        @media (max-height: 500px) and (orientation: landscape) {
            .domain-header {
                padding: 10px;
            }
            
            .domain-header h1 {
                font-size: 1rem;
            }
            
            .characters-sidebar {
                display: none; /* Hide sidebar in landscape */
            }
            
            .main-chat {
                height: calc(100vh - 80px);
                height: calc(100dvh - 80px);
            }
            
            .chat-header {
                padding: 8px 12px;
            }
            
            .chat-input-area {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="domain-container">
        <!-- Header (compact) -->
        <div class="domain-header" style="padding: 8px 15px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
            <a href="/chatchat" class="back-to-dashboard" style="font-size: 0.85rem; padding: 5px 10px;">
                <i class="fas fa-arrow-left"></i> Dashboard
            </a>
            <h1 style="font-size: 1.1rem; margin: 0;"><i class="fas fa-users"></i> Life Companion</h1>
        </div>
        
        <!-- Chat Section -->
        <div class="chat-section">
            <!-- Characters Sidebar -->
            <div class="characters-sidebar">
                <div class="sidebar-title">
                    <i class="fas fa-user-friends"></i> Domain Advisors
                </div>
                <div id="domain-character-list" class="domain-character-list">
                    <!-- Characters loaded dynamically -->
                    <div class="loading-chars">
                        <i class="fas fa-spinner fa-spin"></i> Loading characters...
                    </div>
                </div>
                
                <!-- Analysis Panel (optional) -->
                <div id="character-analysis-panel" class="character-analysis-panel" style="display: none;">
                    <!-- Analysis rendered dynamically -->
                </div>
            </div>
            
            <!-- Main Chat -->
            <div class="main-chat">
                <div class="chat-header">
                    <div class="avatar">
                        <i class="fas fa-star"></i>
                    </div>
                    <div class="info">
                        <h3 id="selected-domain-character">Aria</h3>
                        <p id="selected-character-domain">Coordinator - Sees the bigger picture</p>
                    </div>
                    <!-- Action Buttons Group (icons only) -->
                    <div class="header-actions" style="margin-left: auto; display: flex; gap: 6px; align-items: center;">
                        <button id="pinnedBtn" onclick="MessageHandler.togglePinnedPanel()" 
                            class="header-action-btn" title="View pinned messages" style="padding: 6px 10px; font-size: 16px;">
                            📌
                        </button>
                        <button id="highlightsBtn" onclick="MessageHandler.toggleHighlightsPanel()" 
                            class="header-action-btn" title="View saved highlights" style="padding: 6px 10px; font-size: 16px;">
                            🖍️
                        </button>
                        <button id="searchBtn" onclick="ConversationBox.toggleSearch()" 
                            class="header-action-btn" title="Search messages" style="padding: 6px 10px; font-size: 16px;">
                            🔍
                        </button>
                        <button id="contextBtn" onclick="ExplicitContextUI.toggle()" 
                            class="header-action-btn" title="What I know about you" style="padding: 6px 10px; font-size: 16px;">
                            🧠
                        </button>
                        <label id="analysisBtn" class="header-action-btn" title="Show AI character analysis" 
                            style="padding: 6px 10px; font-size: 14px; display: flex; align-items: center; gap: 4px; cursor: pointer;">
                            <input type="checkbox" id="showAnalysis" style="margin: 0; cursor: pointer;"> 📊
                        </label>
                    </div>
                </div>
                
                <!-- Pinned Messages Panel -->
                <div id="pinned-messages-panel" class="action-panel" style="display: none;">
                    <div class="panel-header">
                        <h4>📌 Pinned Messages</h4>
                        <button onclick="MessageHandler.togglePinnedPanel()" class="panel-close">✕</button>
                    </div>
                    <div id="pinned-messages-content" class="panel-content">
                        <p class="panel-empty">Loading pinned messages...</p>
                    </div>
                </div>
                
                <!-- Highlights Panel -->
                <div id="highlights-panel" class="action-panel" style="display: none;">
                    <div class="panel-header">
                        <h4>🖍️ Saved Highlights</h4>
                        <button onclick="MessageHandler.toggleHighlightsPanel()" class="panel-close">✕</button>
                    </div>
                    <div id="highlights-content" class="panel-content">
                        <p class="panel-empty">Loading highlights...</p>
                    </div>
                </div>
                
                <!-- Explicit Context Panel -->
                <div id="explicit-context-panel" class="action-panel" style="display: none; background: #fafbfc;">
                    <div class="panel-header">
                        <h4>🧠 What I Know About You</h4>
                        <button onclick="ExplicitContextUI.toggle()" class="panel-close">✕</button>
                    </div>
                    <div id="explicit-context-content" class="panel-content">
                        <p class="panel-empty">Loading your context...</p>
                    </div>
                </div>
                
                <div id="domain-chat-messages" class="chat-messages">
                    <!-- Messages loaded dynamically per character -->
                </div>
                
                <!-- Active Attachments Display -->
                <div id="active-attachments" style="display: none; padding: 8px 15px; background: #f0f4ff; border-top: 1px solid #ddd;">
                    <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                        <span style="font-size: 12px; color: #666;"><i class="fas fa-paperclip"></i> Active files:</span>
                        <div id="attachment-badges" style="display: flex; gap: 6px; flex-wrap: wrap;"></div>
                    </div>
                </div>
                
                <div class="chat-input-area">
                    <div class="input-group" style="display: flex; gap: 8px; align-items: flex-end;">
                        <button id="attachBtn" title="Attach file for AI" style="padding: 10px 12px; background: #f0f0f0; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; transition: all 0.2s;">
                            <i class="fas fa-paperclip"></i>
                        </button>
                        <textarea id="userInput" placeholder="Type your message... (Shift+Enter to send)" autocomplete="off" rows="1" style="flex: 1;"></textarea>
                        <button id="sendBtn"><i class="fas fa-paper-plane"></i> Send</button>
                    </div>
                </div>
                
                <!-- File Attachment Modal -->
                <div id="attachment-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
                    <div style="background: white; border-radius: 12px; padding: 24px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.2);">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                            <h3 style="margin: 0; color: #333;"><i class="fas fa-file-upload"></i> Attach File for AI</h3>
                            <button id="close-attachment-modal" style="background: none; border: none; font-size: 20px; cursor: pointer; color: #666;">&times;</button>
                        </div>
                        
                        <form id="attachment-form">
                            <div style="margin-bottom: 16px;">
                                <label style="display: block; margin-bottom: 6px; font-weight: 500; color: #444;">Select File</label>
                                <input type="file" id="attachment-file" style="width: 100%; padding: 10px; border: 2px dashed #ddd; border-radius: 8px; cursor: pointer;">
                                <div id="file-preview" style="margin-top: 8px; font-size: 13px; color: #666;"></div>
                            </div>
                            
                            <div style="margin-bottom: 16px;">
                                <label style="display: block; margin-bottom: 6px; font-weight: 500; color: #444;">What is this file about? <span style="color: #e74c3c;">*</span></label>
                                <textarea id="content-description" placeholder="e.g., This is my resume, a project report, meeting notes..." style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; min-height: 60px; resize: vertical;" required></textarea>
                            </div>
                            
                            <div style="margin-bottom: 20px;">
                                <label style="display: block; margin-bottom: 6px; font-weight: 500; color: #444;">How should AI use this? <span style="color: #999; font-weight: normal;">(optional)</span></label>
                                <textarea id="ai-instructions" placeholder="e.g., Help me improve it, answer questions about it, summarize the key points..." style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; min-height: 60px; resize: vertical;"></textarea>
                            </div>
                            
                            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                                <button type="button" id="cancel-attachment" style="padding: 10px 20px; background: #f0f0f0; border: none; border-radius: 8px; cursor: pointer;">Cancel</button>
                                <button type="submit" id="upload-attachment" style="padding: 10px 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 500;">
                                    <i class="fas fa-upload"></i> Upload
                                </button>
                            </div>
                        </form>
                        
                        <div id="upload-status" style="margin-top: 16px; display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="{{ url_for('static', filename='pwa-register.js') }}"></script>
    <script src="{{ url_for('static', filename='auth_helper.js') }}"></script>
    <script src="{{ url_for('static', filename='message_handler.js') }}"></script>
    <script src="{{ url_for('static', filename='domain_characters.js') }}"></script>
    <script src="{{ url_for('static', filename='conversation_box.js') }}"></script>
    <script src="{{ url_for('static', filename='explicit_context_ui.js') }}"></script>
    <script src="{{ url_for('static', filename='proactive_clarification_ui.js') }}"></script>
    <script src="{{ url_for('static', filename='ai_budget_notifications.js') }}"></script>
    <script src="{{ url_for('static', filename='greeting_handler.js') }}"></script>
    <script>
        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', async function() {
            // Initialize MessageHandler first (use domain-chat-messages container)
            MessageHandler.init('domain-characters', {
                characterDisplayName: 'Aria',
                messageClass: 'message',
                bubbleClass: 'message-content'
            });
            // Override container since domain uses different ID
            MessageHandler.messagesContainer = document.getElementById('domain-chat-messages');
            
            // Enable text highlighting BEFORE loading history
            MessageHandler.enableHighlights('coordinator');
            
            // Initialize DomainCharacters directly (simpler approach)
            await DomainCharacters.init({
                ui: {
                    characterListId: 'domain-character-list',
                    selectedCharacterId: 'selected-domain-character',
                    analysisPanelId: 'character-analysis-panel'
                }
            });
            
            // Load initial character (coordinator) history
            await DomainCharacters.loadCharacterHistory('coordinator');
            
            // Register callback to reload history after re-authentication
            AuthHelper.onAuthenticated(async () => {
                console.log('🔄 Re-authenticated, reloading conversation history...');
                const currentChar = DomainCharacters.selectedCharacter || 'coordinator';
                await DomainCharacters.loadCharacterHistory(currentChar);
            });
            
            // Initialize search functionality (uses ConversationBox search UI)
            ConversationBox.initSearchOnly();
            
            // Handle send button
            document.getElementById('sendBtn').addEventListener('click', async function() {
                const input = document.getElementById('userInput');
                const message = input.value.trim();
                if (message) {
                    input.value = '';
                    input.style.height = '40px'; // Reset height after send
                    await DomainCharacters.sendMessage(message, true);
                }
            });
            
            // Setup multi-line input (Enter=newline, Shift+Enter=send, max 6 lines)
            const userInput = document.getElementById('userInput');
            MessageHandler.setupMultiLineInput(async () => {
                const message = userInput.value.trim();
                if (message) {
                    userInput.value = '';
                    userInput.style.height = '40px'; // Reset height after send
                    await DomainCharacters.sendMessage(message, true);
                }
            });
            
            // Handle analysis toggle - persist to localStorage
            const analysisCheckbox = document.getElementById('showAnalysis');
            const analysisPanel = document.getElementById('character-analysis-panel');
            
            // Restore saved state on load
            const savedAnalysisState = localStorage.getItem('showAiAnalysis');
            if (savedAnalysisState === 'true') {
                analysisCheckbox.checked = true;
                analysisPanel.style.display = 'block';
            }
            
            // Save state on change
            analysisCheckbox.addEventListener('change', function(e) {
                analysisPanel.style.display = e.target.checked ? 'block' : 'none';
                localStorage.setItem('showAiAnalysis', e.target.checked);
            });
            
            // Update character ID when switching characters
            const originalSelectChar = DomainCharacters.selectCharacter;
            DomainCharacters.selectCharacter = async function(charId) {
                await originalSelectChar.call(DomainCharacters, charId);
                MessageHandler.currentCharacterId = charId;
                // Refresh attachments when switching characters
                loadActiveAttachments();
            };
            
            // ==================== FILE ATTACHMENT HANDLING ====================
            const attachBtn = document.getElementById('attachBtn');
            const attachmentModal = document.getElementById('attachment-modal');
            const closeModalBtn = document.getElementById('close-attachment-modal');
            const cancelBtn = document.getElementById('cancel-attachment');
            const attachmentForm = document.getElementById('attachment-form');
            const fileInput = document.getElementById('attachment-file');
            const filePreview = document.getElementById('file-preview');
            const uploadStatus = document.getElementById('upload-status');
            
            // Open modal
            attachBtn.addEventListener('click', () => {
                attachmentModal.style.display = 'flex';
                attachmentForm.reset();
                filePreview.textContent = '';
                uploadStatus.style.display = 'none';
            });
            
            // Close modal
            const closeModal = () => {
                attachmentModal.style.display = 'none';
            };
            closeModalBtn.addEventListener('click', closeModal);
            cancelBtn.addEventListener('click', closeModal);
            attachmentModal.addEventListener('click', (e) => {
                if (e.target === attachmentModal) closeModal();
            });
            
            // File preview
            fileInput.addEventListener('change', () => {
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const sizeMB = (file.size / 1024 / 1024).toFixed(2);
                    filePreview.innerHTML = `<i class="fas fa-file"></i> ${file.name} (${sizeMB} MB)`;
                } else {
                    filePreview.textContent = '';
                }
            });
            
            // Upload attachment
            attachmentForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const file = fileInput.files[0];
                const contentDesc = document.getElementById('content-description').value.trim();
                const aiInstr = document.getElementById('ai-instructions').value.trim();
                
                if (!file) {
                    showUploadStatus('Please select a file', 'error');
                    return;
                }
                if (!contentDesc) {
                    showUploadStatus('Please describe what the file contains', 'error');
                    return;
                }
                
                // Show uploading state
                const uploadBtn = document.getElementById('upload-attachment');
                uploadBtn.disabled = true;
                uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
                
                try {
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('content_description', contentDesc);
                    formData.append('ai_instructions', aiInstr);
                    formData.append('character_id', DomainCharacters.selectedCharacter || 'coordinator');
                    
                    const response = await AuthHelper.authenticatedFetch('/api/ai-attachments/upload', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        showUploadStatus(`✓ "${file.name}" uploaded successfully! AI will now reference this file.`, 'success');
                        setTimeout(() => {
                            closeModal();
                            loadActiveAttachments();
                        }, 1500);
                    } else {
                        showUploadStatus(data.error || 'Upload failed', 'error');
                    }
                } catch (err) {
                    console.error('Upload error:', err);
                    showUploadStatus('Upload failed. Please try again.', 'error');
                } finally {
                    uploadBtn.disabled = false;
                    uploadBtn.innerHTML = '<i class="fas fa-upload"></i> Upload';
                }
            });
            
            function showUploadStatus(message, type) {
                uploadStatus.style.display = 'block';
                uploadStatus.style.padding = '10px';
                uploadStatus.style.borderRadius = '8px';
                uploadStatus.style.background = type === 'error' ? '#ffe6e6' : '#e6ffe6';
                uploadStatus.style.color = type === 'error' ? '#c00' : '#060';
                uploadStatus.textContent = message;
            }
            
            // Load and display active attachments
            async function loadActiveAttachments() {
                try {
                    const charId = DomainCharacters.selectedCharacter || 'coordinator';
                    const response = await AuthHelper.authenticatedFetch(`/api/ai-attachments?character_id=${charId}`);
                    const data = await response.json();
                    
                    const container = document.getElementById('active-attachments');
                    const badges = document.getElementById('attachment-badges');
                    
                    if (data.success && data.attachments && data.attachments.length > 0) {
                        container.style.display = 'block';
                        badges.innerHTML = data.attachments.map(att => `
                            <span class="attachment-badge" data-id="${att.id}" style="display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; background: white; border: 1px solid #667eea; border-radius: 15px; font-size: 12px; color: #667eea;">
                                <i class="fas fa-file"></i>
                                <span title="${att.content_description}">${att.original_filename.length > 20 ? att.original_filename.substring(0, 17) + '...' : att.original_filename}</span>
                                <button onclick="removeAttachment(${att.id})" style="background: none; border: none; color: #999; cursor: pointer; padding: 0 2px; font-size: 14px;" title="Remove">&times;</button>
                            </span>
                        `).join('');
                    } else {
                        container.style.display = 'none';
                        badges.innerHTML = '';
                    }
                } catch (err) {
                    console.error('Error loading attachments:', err);
                }
            }
            
            // Remove attachment
            window.removeAttachment = async function(attachmentId) {
                if (!confirm('Remove this file from AI context?')) return;
                
                try {
                    const response = await AuthHelper.authenticatedFetch(`/api/ai-attachments/${attachmentId}`, {
                        method: 'DELETE'
                    });
                    const data = await response.json();
                    if (data.success) {
                        loadActiveAttachments();
                    }
                } catch (err) {
                    console.error('Error removing attachment:', err);
                }
            };
            
            // Load attachments on init
            loadActiveAttachments();
            
            // Initialize Explicit Context UI
            ExplicitContextUI.init('explicit-context-panel', 'coordinator');
            
            // Initialize Proactive Clarification UI
            ProactiveClarificationUI.init();
            
            // Initialize AI Budget Notifications
            AIBudgetNotifications.init();
            
            // Update explicit context when switching characters
            const origSelectCharForContext = DomainCharacters.selectCharacter;
            DomainCharacters.selectCharacter = async function(charId) {
                await origSelectCharForContext.call(DomainCharacters, charId);
                ExplicitContextUI.setCharacter(charId);
            };
            
            console.log('✅ Domain Characters page initialized');
        });
    </script>
</body>
</html>
