<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern Manager - AI Model Compare</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="{{ url_for('static', filename='js/helpers.js') }}"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1rem;
        }

        .back-link {
            position: absolute;
            top: 30px;
            left: 30px;
            color: white;
            text-decoration: none;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.9;
            transition: opacity 0.3s;
        }

        .back-link:hover {
            opacity: 1;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card.archival {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .stat-card h3 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .stat-card p {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            text-decoration: none;
            color: white;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #28a745;
        }

        .btn-success:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #dee2e6;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #dee2e6;
            vertical-align: top;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .pattern-code {
            background: #f4f4f4;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            word-break: break-all;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .badge-pending {
            background: #ffc107;
            color: #000;
        }

        .badge-approved {
            background: #28a745;
            color: white;
        }

        .badge-rejected {
            background: #dc3545;
            color: white;
        }

        .sample-matches {
            font-size: 0.85rem;
            color: #666;
            margin-top: 5px;
        }

        .sample-matches li {
            margin-bottom: 3px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s;
        }

        .modal-content {
            background: white;
            margin: 50px auto;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideIn 0.3s;
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #333;
            font-size: 1.5rem;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/chatchat" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Chat
            </a>
            <h1><i class="fas fa-brain"></i> Pattern Manager</h1>
            <p>AI-Assisted Pattern Expansion & Context Archival</p>
        </div>

        <div class="content">
            <!-- Statistics Section -->
            <div class="section">
                <h2><i class="fas fa-chart-bar"></i> Statistics</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3 id="stat-pending">-</h3>
                        <p>Pending Patterns</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="stat-active">-</h3>
                        <p>Active Contexts</p>
                    </div>
                    <div class="stat-card archival">
                        <h3 id="stat-expired">-</h3>
                        <p>Expired Contexts</p>
                    </div>
                    <div class="stat-card archival">
                        <h3 id="stat-archived">-</h3>
                        <p>Archived Contexts</p>
                    </div>
                </div>
            </div>

            <!-- Actions Section -->
            <div class="section">
                <h2><i class="fas fa-cogs"></i> Actions</h2>
                <div class="actions">
                    <button class="btn btn-primary" onclick="runPatternAnalysis()">
                        <i class="fas fa-brain"></i> Run Pattern Analysis
                    </button>
                    <button class="btn btn-primary" onclick="runArchivalMaintenance()">
                        <i class="fas fa-archive"></i> Run Archival Maintenance
                    </button>
                    <button class="btn btn-primary" onclick="refreshData()">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
            </div>

            <!-- Pattern Suggestions Section -->
            <div class="section">
                <h2><i class="fas fa-lightbulb"></i> Pattern Suggestions</h2>
                <div id="patterns-container">
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Loading pattern suggestions...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Review Modal -->
    <div id="reviewModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Review Pattern</h3>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Pattern:</label>
                    <div class="pattern-code" id="modal-pattern"></div>
                </div>
                <div class="form-group">
                    <label>Type:</label>
                    <div id="modal-type"></div>
                </div>
                <div class="form-group">
                    <label>Description:</label>
                    <div id="modal-description"></div>
                </div>
                <div class="form-group">
                    <label>Sample Matches:</label>
                    <ul id="modal-samples" class="sample-matches"></ul>
                </div>
                <div class="form-group">
                    <label for="modal-notes">Notes:</label>
                    <textarea id="modal-notes" rows="4" placeholder="Optional notes..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-success" onclick="approvePattern()">
                    <i class="fas fa-check"></i> Approve
                </button>
                <button class="btn btn-danger" onclick="rejectPattern()">
                    <i class="fas fa-times"></i> Reject
                </button>
                <button class="btn" style="background: #6c757d;" onclick="closeModal()">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentPatternId = null;

        // Load data on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Check authentication
            if (!isAuthenticated()) {
                window.location.href = '/chatchat';
                return;
            }
            
            loadData();
        });

        async function loadData() {
            await Promise.all([
                loadPatternSuggestions(),
                loadArchivalStats()
            ]);
        }

        async function loadPatternSuggestions() {
            try {
                const response = await apiRequest('/api/admin/patterns/suggestions');
                const data = await response.json();

                const container = document.getElementById('patterns-container');
                
                if (!data.suggestions || data.suggestions.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <h3>No Pending Patterns</h3>
                            <p>Run pattern analysis to discover new extraction patterns</p>
                        </div>
                    `;
                    document.getElementById('stat-pending').textContent = '0';
                    return;
                }

                document.getElementById('stat-pending').textContent = data.suggestions.length;

                let html = '<table><thead><tr>';
                html += '<th>Pattern</th>';
                html += '<th>Type</th>';
                html += '<th>Description</th>';
                html += '<th>Confidence</th>';
                html += '<th>Samples</th>';
                html += '<th>Actions</th>';
                html += '</tr></thead><tbody>';

                data.suggestions.forEach(pattern => {
                    html += '<tr>';
                    html += `<td><div class="pattern-code">${escapeHtml(pattern.pattern_regex)}</div></td>`;
                    html += `<td><span class="badge badge-pending">${pattern.context_type}</span></td>`;
                    html += `<td>${escapeHtml(pattern.description || 'N/A')}</td>`;
                    html += `<td>${(pattern.confidence * 100).toFixed(0)}%</td>`;
                    html += '<td><ul class="sample-matches">';
                    (pattern.sample_matches || []).slice(0, 2).forEach(sample => {
                        html += `<li>"${escapeHtml(sample)}"</li>`;
                    });
                    html += '</ul></td>';
                    html += `<td><button class="btn btn-primary" style="padding: 8px 16px; font-size: 0.9rem;" onclick="reviewPattern(${pattern.id})">`;
                    html += '<i class="fas fa-eye"></i> Review</button></td>';
                    html += '</tr>';
                });

                html += '</tbody></table>';
                container.innerHTML = html;

            } catch (error) {
                console.error('Error loading patterns:', error);
                showNotification('Failed to load pattern suggestions', 'error');
            }
        }

        async function loadArchivalStats() {
            try {
                const response = await apiRequest('/api/admin/archival/stats');
                const data = await response.json();

                if (data.stats) {
                    document.getElementById('stat-active').textContent = data.stats.total_active || '0';
                    document.getElementById('stat-expired').textContent = data.stats.total_expired || '0';
                    document.getElementById('stat-archived').textContent = data.stats.total_archived || '0';
                }
            } catch (error) {
                console.error('Error loading archival stats:', error);
            }
        }

        async function runPatternAnalysis() {
            const btn = event.target.closest('button');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analyzing...';

            try {
                const response = await apiRequest('/api/admin/patterns/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ days: 7, limit: 50 })
                });

                const data = await response.json();
                showNotification(`Analysis complete! Found ${data.suggestions_count} new patterns`, 'success');
                await loadPatternSuggestions();

            } catch (error) {
                console.error('Error running analysis:', error);
                showNotification('Failed to run pattern analysis', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-brain"></i> Run Pattern Analysis';
            }
        }

        async function runArchivalMaintenance() {
            const btn = event.target.closest('button');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Running...';

            try {
                const response = await apiRequest('/api/admin/archival/run', {
                    method: 'POST'
                });

                const data = await response.json();
                const results = data.results;
                
                let message = 'Maintenance complete!\n';
                message += `Decayed: ${results.decay.decayed_count}\n`;
                message += `Expired: ${results.decay.expired_count + results.expiration.expired_count}\n`;
                message += `Archived: ${results.archival.archived_count}`;
                
                showNotification(message, 'success');
                await loadArchivalStats();

            } catch (error) {
                console.error('Error running maintenance:', error);
                showNotification('Failed to run maintenance', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-archive"></i> Run Archival Maintenance';
            }
        }

        async function refreshData() {
            const btn = event.target.closest('button');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Refreshing...';

            await loadData();

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sync-alt"></i> Refresh';
            showNotification('Data refreshed', 'success');
        }

        async function reviewPattern(patternId) {
            try {
                const response = await apiRequest('/api/admin/patterns/suggestions');
                const data = await response.json();
                const pattern = data.suggestions.find(p => p.id === patternId);

                if (!pattern) {
                    showNotification('Pattern not found', 'error');
                    return;
                }

                currentPatternId = patternId;
                
                document.getElementById('modal-pattern').textContent = pattern.pattern_regex;
                document.getElementById('modal-type').innerHTML = `<span class="badge badge-pending">${pattern.context_type}</span>`;
                document.getElementById('modal-description').textContent = pattern.description || 'N/A';
                
                const samplesList = document.getElementById('modal-samples');
                samplesList.innerHTML = '';
                (pattern.sample_matches || []).forEach(sample => {
                    const li = document.createElement('li');
                    li.textContent = `"${sample}"`;
                    samplesList.appendChild(li);
                });
                
                document.getElementById('modal-notes').value = '';
                document.getElementById('reviewModal').style.display = 'block';

            } catch (error) {
                console.error('Error loading pattern details:', error);
                showNotification('Failed to load pattern details', 'error');
            }
        }

        async function approvePattern() {
            if (!currentPatternId) return;

            const notes = document.getElementById('modal-notes').value;

            try {
                await apiRequest(`/api/admin/patterns/${currentPatternId}/approve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ notes })
                });

                showNotification('Pattern approved!', 'success');
                closeModal();
                await loadPatternSuggestions();

            } catch (error) {
                console.error('Error approving pattern:', error);
                showNotification('Failed to approve pattern', 'error');
            }
        }

        async function rejectPattern() {
            if (!currentPatternId) return;

            const reason = document.getElementById('modal-notes').value;

            try {
                await apiRequest(`/api/admin/patterns/${currentPatternId}/reject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reason })
                });

                showNotification('Pattern rejected', 'success');
                closeModal();
                await loadPatternSuggestions();

            } catch (error) {
                console.error('Error rejecting pattern:', error);
                showNotification('Failed to reject pattern', 'error');
            }
        }

        function closeModal() {
            document.getElementById('reviewModal').style.display = 'none';
            currentPatternId = null;
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('reviewModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
