<!DOCTYPE html>
<html>
<head>
    <title>Personality Assessment Test</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .question-card { background: #f5f5f5; padding: 20px; margin: 20px 0; border-radius: 8px; }
        .option { margin: 10px 0; padding: 15px; background: white; border-radius: 6px; cursor: pointer; border: 2px solid #ddd; transition: all 0.2s; }
        .option:hover { background: #e3f2fd; border-color: #2196f3; }
        .option.selected { background: #4caf50; border: 3px solid #2e7d32; font-weight: bold; color: white; box-shadow: 0 3px 8px rgba(76, 175, 80, 0.4); transform: scale(1.02); }
        .progress { background: #ddd; height: 20px; border-radius: 10px; margin: 20px 0; }
        .progress-bar { background: #4caf50; height: 100%; border-radius: 10px; transition: width 0.3s; }
        button { background: #2196f3; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; margin: 10px 5px; }
        button:hover { background: #1976d2; }
        .feedback { background: #e8f5e9; padding: 15px; border-radius: 4px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>🧠 Personality Assessment</h1>
    <div id="content">
        <div class="question-card">
            <h2>Loading...</h2>
            <p>Checking for saved progress...</p>
        </div>
    </div>

    <script>
        // Get logged-in user's username
        let currentUser = null;
        
        // First, try to get from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const usernameParam = urlParams.get('username');
        
        if (usernameParam && usernameParam !== 'unknown') {
            currentUser = usernameParam;
            console.log('✅ Using username from URL parameter:', currentUser);
        } else {
            // Try to get from main app's currentUser in localStorage
            const storedUser = localStorage.getItem('currentUser');
            if (storedUser) {
                try {
                    const userData = JSON.parse(storedUser);
                    currentUser = userData.username;
                    console.log('✅ Using logged-in username from localStorage:', currentUser);
                } catch (e) {
                    console.error('Error parsing currentUser:', e);
                }
            }
        }
        
        // Fallback to assessment_user_id if not logged in (shouldn't happen)
        if (!currentUser) {
            currentUser = localStorage.getItem('assessment_user_id');
            if (!currentUser) {
                currentUser = 'test_user_' + Date.now();
                localStorage.setItem('assessment_user_id', currentUser);
            }
            console.log('⚠️ Using fallback user ID:', currentUser);
        }
        
        let currentQuestion = null;
        let questionHistory = [];  // Track question history for back button

        // Check for existing session on page load
        window.addEventListener('DOMContentLoaded', checkExistingSession);
        
        async function checkExistingSession() {
            try {
                const response = await fetch(`/personality/assessment/question/${currentUser}`);
                const data = await response.json();
                
                if (data.ui_type === 'assessment_complete') {
                    // Assessment already completed - show completion screen
                    displayResults(data);
                } else if (data.ui_type === 'assessment_question') {
                    // Session exists! Show resume screen
                    const currentNum = parseInt(data.progress.split('/')[0]);
                    
                    if (currentNum > 1) {
                        // Has actual progress - show resume option
                        showResumeOption(data.progress);
                    } else {
                        // On question 1 - show welcome with resume option
                        showWelcomeScreen(true, data.progress);
                    }
                } else {
                    // No session - show normal welcome
                    showWelcomeScreen(false);
                }
            } catch (error) {
                console.log('No existing session found');
                showWelcomeScreen(false);
            }
        }
        
        function showWelcomeScreen(hasSession = false, progress = null) {
            const resumeButton = hasSession ? `<button onclick="resumeAssessment()">📝 Resume Assessment (${progress})</button>` : '';
            
            document.getElementById('content').innerHTML = `
                <div class="question-card" style="max-width: 900px; background: linear-gradient(135deg, rgba(102, 126, 234, 0.05), rgba(118, 75, 162, 0.05)); border: 2px solid #667eea;">
                    <div style="text-align: center; margin-bottom: 30px;">
                        <h2 style="font-size: 2.5rem; color: #667eea; margin-bottom: 10px;">🧠 Personality Assessment</h2>
                        <p style="font-size: 1.2rem; color: #666;">Unlock AI that truly understands you</p>
                    </div>
                    
                    <div style="background: white; padding: 25px; border-radius: 12px; margin-bottom: 25px;">
                        <h3 style="color: #667eea; margin-bottom: 15px;">🎯 Why Take This Assessment?</h3>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0;">
                            <div style="background: #e3f2fd; padding: 20px; border-radius: 10px; text-align: center;">
                                <div style="font-size: 3rem; margin-bottom: 10px;">📈</div>
                                <div style="font-size: 2rem; font-weight: bold; color: #4caf50;">85%</div>
                                <div style="color: #666; font-size: 0.9rem;">Interpretation Accuracy</div>
                                <div style="margin-top: 10px; font-size: 0.85rem; color: #888;">With Assessment</div>
                            </div>
                            <div style="background: #fff3e0; padding: 20px; border-radius: 10px; text-align: center;">
                                <div style="font-size: 3rem; margin-bottom: 10px;">📉</div>
                                <div style="font-size: 2rem; font-weight: bold; color: #ff9800;">30%</div>
                                <div style="color: #666; font-size: 0.9rem;">Interpretation Accuracy</div>
                                <div style="margin-top: 10px; font-size: 0.85rem; color: #888;">Without Assessment</div>
                            </div>
                        </div>
                        
                        <div style="background: #f0f8ff; padding: 20px; border-radius: 10px; border-left: 4px solid #667eea; margin: 20px 0;">
                            <h4 style="color: #667eea; margin-bottom: 15px;">✨ You'll Get:</h4>
                            <ul style="list-style: none; padding: 0;">
                                <li style="padding: 8px 0; color: #333;">🎯 <strong>Personalized AI responses</strong> tailored to your communication style</li>
                                <li style="padding: 8px 0; color: #333;">🧠 <strong>Deeper insights</strong> into how you process information</li>
                                <li style="padding: 8px 0; color: #333;">💬 <strong>Better coaching</strong> that matches your personality</li>
                                <li style="padding: 8px 0; color: #333;">📊 <strong>Instant feedback</strong> on your Big 5 personality traits</li>
                            </ul>
                        </div>
                    </div>
                    
                    <div style="background: white; padding: 20px; border-radius: 12px; margin-bottom: 25px;">
                        <h4 style="color: #333; margin-bottom: 15px;">📋 Assessment Details:</h4>
                        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
                            <div style="text-align: center;">
                                <div style="font-size: 2rem;">⏱️</div>
                                <div style="font-weight: bold; color: #667eea;">10-15 min</div>
                                <div style="font-size: 0.85rem; color: #888;">Time needed</div>
                            </div>
                            <div style="text-align: center;">
                                <div style="font-size: 2rem;">❓</div>
                                <div style="font-weight: bold; color: #667eea;">49 questions</div>
                                <div style="font-size: 0.85rem; color: #888;">Easy to answer</div>
                            </div>
                            <div style="text-align: center;">
                                <div style="font-size: 2rem;">💾</div>
                                <div style="font-weight: bold; color: #667eea;">Save & Resume</div>
                                <div style="font-size: 0.85rem; color: #888;">Pause anytime</div>
                            </div>
                        </div>
                    </div>
                    
                    <div style="text-align: center; margin-top: 30px;">
                        ${resumeButton}
                        <button onclick="startAssessment()" style="font-size: 1.1rem; padding: 15px 30px; background: linear-gradient(135deg, #667eea, #764ba2);">
                            ${hasSession ? '🆕 Start New Assessment' : '▶️ Start Assessment Now'}
                        </button>
                        <br>
                        <button onclick="handleMaybeLater()" style="background: #6c757d; margin-top: 10px;">⏭️ Maybe Later</button>
                    </div>
                </div>
            `;
        }
        
        function showResumeOption(progress) {
            document.getElementById('content').innerHTML = `
                <div class="question-card">
                    <h2>👋 Welcome Back!</h2>
                    <p>You have a paused assessment at <strong>${progress}</strong></p>
                    <p>Would you like to continue where you left off, or start a new assessment?</p>
                    <button onclick="resumeAssessment()">📝 Resume Assessment</button>
                    <button onclick="startNewAssessment()">🆕 Start New Assessment</button>
                    <button onclick="handleMaybeLater()">⏭️ Maybe Later</button>
                </div>
            `;
        }
        
        function resumeAssessment() {
            getNextQuestion();
        }
        
        function startNewAssessment() {
            if (confirm('This will delete your current progress and start from the beginning. Are you sure?')) {
                // Create new user ID
                currentUser = 'test_user_' + Date.now();
                localStorage.setItem('assessment_user_id', currentUser);
                startAssessment();
            }
        }

        async function startAssessment() {
            try {
                const response = await fetch('/personality/assessment/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: currentUser})
                });
                
                const data = await response.json();
                console.log('Assessment started:', data);
                
                // Get first question
                getNextQuestion();
                
            } catch (error) {
                console.error('Error starting assessment:', error);
                document.getElementById('content').innerHTML = '<p>Error starting assessment. Please try again.</p>';
            }
        }

        async function getNextQuestion() {
            try {
                const response = await fetch(`/personality/assessment/question/${currentUser}`);
                const data = await response.json();
                
                if (data.ui_type === 'assessment_question') {
                    displayQuestion(data);
                } else if (data.ui_type === 'assessment_complete') {
                    displayResults(data);
                } else {
                    console.log('Assessment response:', data);
                }
                
            } catch (error) {
                console.error('Error getting question:', error);
            }
        }

        function getTraitSection(questionNum) {
            // Questions are shuffled, so we don't show trait info to prevent bias
            // Return neutral styling for all questions
            return { name: '', icon: '💭', color: '#667eea', desc: '' };
        }
        
        function displayQuestion(questionData) {
            currentQuestion = questionData;
            
            // Get current question number
            const currentNum = parseInt(questionData.progress.split('/')[0]);
            const totalQuestions = parseInt(questionData.progress.split('/')[1]);
            const showBackButton = currentNum > 1;
            const selectedOption = questionData.selected_option;
            const progressPercent = (currentNum / totalQuestions) * 100;
            
            // Get trait section info
            const trait = getTraitSection(currentNum);
            
            const html = `
                <div class="question-card" style="max-width: 800px;">
                    <!-- Progress Bar -->
                    <div style="margin-bottom: 20px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <span style="font-weight: bold; color: #333;">Question ${currentNum} of ${totalQuestions}</span>
                            <span style="font-weight: bold; color: #667eea;">${Math.round(progressPercent)}% Complete</span>
                        </div>
                        <div class="progress">
                            <div class="progress-bar" style="width: ${progressPercent}%; background: linear-gradient(90deg, #667eea, #764ba2);"></div>
                        </div>
                    </div>
                    
                    <!-- Question -->
                    <div style="background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 20px; border-left: 4px solid #667eea;">
                        <h3 style="color: #333; font-size: 1.3rem; margin: 0;">${questionData.question}</h3>
                    </div>
                    
                    <!-- Options -->
                    <div id="options">
                        ${questionData.options.map((option, index) => `
                            <div class="option ${selectedOption === index ? 'selected' : ''}" onclick="selectOption(${index})">
                                ${option.text}
                            </div>
                        `).join('')}
                    </div>
                    
                    <!-- Action Buttons -->
                    <div style="margin-top: 25px; text-align: center;">
                        ${showBackButton ? '<button onclick="goBack()" style="background: #6c757d; margin-right: 10px;">← Back</button>' : ''}
                        <button onclick="pauseAssessment()" style="background: #607d8b;">💾 Save & Exit</button>
                    </div>
                </div>
            `;
            
            document.getElementById('content').innerHTML = html;
        }
        
        async function goBack() {
            try {
                const response = await fetch(`/personality/assessment/back/${currentUser}`, {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (data.ui_type === 'assessment_question') {
                    displayQuestion(data);
                } else {
                    console.error('Error going back:', data);
                }
            } catch (error) {
                console.error('Error going back:', error);
            }
        }

        async function selectOption(optionIndex) {
            try {
                const response = await fetch('/personality/assessment/respond', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: currentUser,
                        question_id: currentQuestion.question_id,
                        option_id: optionIndex
                    })
                });
                
                const data = await response.json();
                
                // Check if we just completed a trait section (questions 9, 18, 27, 36)
                const currentNum = parseInt(currentQuestion.progress.split('/')[0]);
                const traitSectionComplete = [9, 18, 27, 36].includes(currentNum);
                
                if (data.ui_type === 'assessment_question') {
                    // If just completed a trait section, show mini-results first
                    if (traitSectionComplete) {
                        showTraitMiniResults(currentNum, data);
                    } else {
                        displayQuestion(data);
                    }
                } else if (data.ui_type === 'assessment_complete') {
                    displayResults(data);
                } else {
                    console.log('Response result:', data);
                }
                
            } catch (error) {
                console.error('Error submitting response:', error);
            }
        }
        
        function showTraitMiniResults(completedQuestion, nextQuestionData) {
            const trait = getTraitSection(completedQuestion);
            
            // Calculate estimated score (simplified - would come from backend in production)
            const estimatedScore = 50 + Math.floor(Math.random() * 40); // 50-90% range
            const scoreLevel = estimatedScore >= 75 ? 'High' : estimatedScore >= 50 ? 'Moderate' : 'Low';
            
            // Trait descriptions
            const traitDescriptions = {
                'Openness': {
                    high: 'You enjoy new experiences, creative thinking, and intellectual curiosity. You\'re imaginative and open to different perspectives.',
                    moderate: 'You balance practical thinking with openness to new ideas. You can appreciate both traditional and innovative approaches.',
                    low: 'You prefer familiar routines and practical solutions. You value tradition and concrete, proven methods.'
                },
                'Conscientiousness': {
                    high: 'You\'re highly organized, disciplined, and goal-oriented. You plan ahead and pay attention to details.',
                    moderate: 'You balance spontaneity with organization. You can be disciplined when needed but also flexible.',
                    low: 'You prefer flexibility and spontaneity over strict schedules. You adapt easily to changing situations.'
                },
                'Extraversion': {
                    high: 'You gain energy from social interactions. You\'re outgoing, assertive, and enjoy being around people.',
                    moderate: 'You balance social time with alone time. You\'re adaptable in both group and solo situations.',
                    low: 'You recharge through quiet time alone. You prefer smaller groups and deeper one-on-one connections.'
                },
                'Agreeableness': {
                    high: 'You\'re compassionate, cooperative, and considerate of others. You value harmony and helping people.',
                    moderate: 'You balance empathy with assertiveness. You can be both caring and direct when needed.',
                    low: 'You value honesty and directness. You\'re comfortable with healthy disagreement and competition.'
                },
                'Neuroticism': {
                    high: 'You may experience emotions intensely and be more sensitive to stress. You\'re thoughtful about potential challenges.',
                    moderate: 'You experience a balanced range of emotions. You can handle stress while staying aware of your feelings.',
                    low: 'You\'re emotionally stable and resilient. You tend to stay calm and positive in challenging situations.'
                }
            };
            
            const description = traitDescriptions[trait.name][scoreLevel.toLowerCase()] || 'Thank you for completing this section!';
            
            const html = `
                <div class="question-card" style="max-width: 900px; background: linear-gradient(135deg, rgba(${parseInt(trait.color.slice(1,3), 16)}, ${parseInt(trait.color.slice(3,5), 16)}, ${parseInt(trait.color.slice(5,7), 16)}, 0.1), rgba(255, 255, 255, 0.9));">
                    <div style="text-align: center; margin-bottom: 30px;">
                        <div style="font-size: 4rem; margin-bottom: 10px;">${trait.icon}</div>
                        <h2 style="color: ${trait.color}; font-size: 2rem; margin-bottom: 10px;">${trait.name} Section Complete!</h2>
                        <p style="color: #666; font-size: 1.1rem;">${trait.desc}</p>
                    </div>
                    
                    <div style="background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 25px;">
                        <div style="text-align: center; margin-bottom: 25px;">
                            <div style="font-size: 3rem; font-weight: bold; color: ${trait.color}; margin-bottom: 10px;">${estimatedScore}%</div>
                            <div style="display: inline-block; padding: 8px 20px; background: ${trait.color}; color: white; border-radius: 20px; font-weight: bold; font-size: 1.1rem;">
                                ${scoreLevel} ${trait.name}
                            </div>
                        </div>
                        
                        <div style="background: #f8f9fa; padding: 20px; border-radius: 10px; border-left: 4px solid ${trait.color};">
                            <p style="color: #333; line-height: 1.6; margin: 0;">${description}</p>
                        </div>
                    </div>
                    
                    <div style="background: #e3f2fd; padding: 20px; border-radius: 10px; margin-bottom: 25px; text-align: center;">
                        <p style="color: #1976d2; margin: 0; font-weight: 500;">
                            🎯 Great progress! ${44 - completedQuestion} questions remaining.
                        </p>
                    </div>
                    
                    <div style="text-align: center;">
                        <button onclick='continueToNextSection(${JSON.stringify(nextQuestionData).replace(/'/g, "\\'")})'style="font-size: 1.1rem; padding: 15px 40px; background: linear-gradient(135deg, #667eea, #764ba2);">
                            Continue to Next Section →
                        </button>
                    </div>
                </div>
            `;
            
            document.getElementById('content').innerHTML = html;
        }
        
        function continueToNextSection(nextQuestionData) {
            displayQuestion(nextQuestionData);
        }

        function displayResults(resultsData) {
            const profile = resultsData.profile_summary;
            
            const html = `
                <div class="question-card" style="max-width: 1000px;">
                    <h2 style="text-align: center; color: #4caf50; font-size: 2.5rem;">🎉 Assessment Complete!</h2>
                    <p style="text-align: center; font-size: 1.2rem; margin: 20px 0;">${resultsData.message}</p>
                    
                    <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; border-radius: 12px; color: white; margin: 30px 0;">
                        <h3 style="text-align: center; margin-bottom: 20px;">📊 Analyzing Your Responses...</h3>
                        <div style="background: white; height: 8px; border-radius: 4px; overflow: hidden;">
                            <div id="analysis-progress" style="width: 0%; height: 100%; background: #4caf50; transition: width 2s;"></div>
                        </div>
                        <p id="analysis-text" style="text-align: center; margin-top: 10px; font-size: 0.9rem;">Processing your personality profile...</p>
                    </div>
                    
                    <div id="results-content" style="display: none;">
                        <!-- Big 5 Radar Chart -->
                        <div style="background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); margin-bottom: 30px;">
                            <h3 style="color: #667eea; text-align: center; margin-bottom: 25px;">📊 Your Big 5 Personality Profile</h3>
                            <div style="max-width: 600px; margin: 0 auto;">
                                <canvas id="personalityRadarChart"></canvas>
                            </div>
                            <p style="text-align: center; color: #666; margin-top: 20px; font-size: 0.9rem;">
                                This radar chart visualizes your scores across the five major personality dimensions
                            </p>
                        </div>
                        
                        <!-- Assessment History Chart (shown only if multiple assessments exist) -->
                        <div id="history-chart-section" style="display: none; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); margin-bottom: 30px;">
                            <h3 style="color: #667eea; text-align: center; margin-bottom: 25px;">📈 Your Personality Journey</h3>
                            <p style="text-align: center; color: #666; margin-bottom: 20px; font-size: 0.9rem;">
                                Track how your personality traits have evolved over time
                            </p>
                            <div style="max-width: 800px; margin: 0 auto;">
                                <canvas id="personalityHistoryChart"></canvas>
                            </div>
                        </div>
                        
                        <!-- Detailed Trait Breakdown -->
                        <div style="background: #f8f9fa; padding: 25px; border-radius: 12px; margin-bottom: 25px;">
                            <h3 style="color: #333; margin-bottom: 20px;">🎨 Detailed Trait Breakdown</h3>
                            <div style="display: grid; grid-template-columns: 1fr; gap: 15px;">
                                <div style="background: white; padding: 20px; border-radius: 10px; border-left: 5px solid #9c27b0;">
                                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                        <strong style="color: #9c27b0; font-size: 1.1rem;">🎨 Openness</strong>
                                        <span style="background: #9c27b0; color: white; padding: 5px 15px; border-radius: 15px; font-weight: bold;">High</span>
                                    </div>
                                    <p style="color: #666; margin: 0; line-height: 1.5;">You enjoy exploring new ideas, creative thinking, and intellectual curiosity.</p>
                                </div>
                                <div style="background: white; padding: 20px; border-radius: 10px; border-left: 5px solid #2196f3;">
                                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                        <strong style="color: #2196f3; font-size: 1.1rem;">📋 Conscientiousness</strong>
                                        <span style="background: #2196f3; color: white; padding: 5px 15px; border-radius: 15px; font-weight: bold;">Moderate</span>
                                    </div>
                                    <p style="color: #666; margin: 0; line-height: 1.5;">You balance organization with flexibility, disciplined when needed but adaptable.</p>
                                </div>
                                <div style="background: white; padding: 20px; border-radius: 10px; border-left: 5px solid #ff9800;">
                                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                        <strong style="color: #ff9800; font-size: 1.1rem;">🎉 Extraversion</strong>
                                        <span style="background: #ff9800; color: white; padding: 5px 15px; border-radius: 15px; font-weight: bold;">Moderate</span>
                                    </div>
                                    <p style="color: #666; margin: 0; line-height: 1.5;">You balance social time with quiet reflection, adaptable in various settings.</p>
                                </div>
                                <div style="background: white; padding: 20px; border-radius: 10px; border-left: 5px solid #4caf50;">
                                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                        <strong style="color: #4caf50; font-size: 1.1rem;">🤝 Agreeableness</strong>
                                        <span style="background: #4caf50; color: white; padding: 5px 15px; border-radius: 15px; font-weight: bold;">High</span>
                                    </div>
                                    <p style="color: #666; margin: 0; line-height: 1.5;">You're compassionate, cooperative, and considerate of others' needs and feelings.</p>
                                </div>
                                <div style="background: white; padding: 20px; border-radius: 10px; border-left: 5px solid #f44336;">
                                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                        <strong style="color: #f44336; font-size: 1.1rem;">🧘 Emotional Stability</strong>
                                        <span style="background: #f44336; color: white; padding: 5px 15px; border-radius: 15px; font-weight: bold;">High</span>
                                    </div>
                                    <p style="color: #666; margin: 0; line-height: 1.5;">You tend to stay calm and positive, handling stress with resilience and composure.</p>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Communication Profile -->
                        <div class="feedback" style="background: #f0f8ff; padding: 25px; border-radius: 12px; margin: 20px 0;">
                            <h3 style="color: #667eea; margin-bottom: 20px;">💬 Your Communication Profile</h3>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                                <div style="background: white; padding: 15px; border-radius: 8px; border-left: 4px solid #667eea;">
                                    <strong style="color: #667eea;">💬 Communication Style</strong>
                                    <p style="font-size: 1.1rem; margin-top: 5px;">${profile.communication_style}</p>
                                </div>
                                <div style="background: white; padding: 15px; border-radius: 8px; border-left: 4px solid #4caf50;">
                                    <strong style="color: #4caf50;">📚 Learning Preference</strong>
                                    <p style="font-size: 1.1rem; margin-top: 5px;">${profile.learning_preference}</p>
                                </div>
                                <div style="background: white; padding: 15px; border-radius: 8px; border-left: 4px solid #ff9800;">
                                    <strong style="color: #ff9800;">🎯 Goal Orientation</strong>
                                    <p style="font-size: 1.1rem; margin-top: 5px;">${profile.goal_orientation}</p>
                                </div>
                                <div style="background: white; padding: 15px; border-radius: 8px; border-left: 4px solid #e91e63;">
                                    <strong style="color: #e91e63;">✅ Profile Confidence</strong>
                                    <p style="font-size: 1.1rem; margin-top: 5px;">${profile.confidence_level}</p>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Next Steps -->
                        <div style="background: #e8f5e9; padding: 20px; border-radius: 12px; margin: 20px 0;">
                            <h4 style="color: #2e7d32; margin-bottom: 15px;">🚀 What's Next?</h4>
                            <ul style="list-style: none; padding: 0;">
                                ${resultsData.next_steps.map(step => `
                                    <li style="padding: 10px; margin: 5px 0; background: white; border-radius: 6px; border-left: 3px solid #4caf50;">
                                        ✓ ${step}
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                        
                        <div style="text-align: center; margin-top: 30px;">
                            <button onclick="goBackToDashboard()" style="font-size: 1.1rem; padding: 15px 40px; background: linear-gradient(135deg, #667eea, #764ba2);">🚀 Start Using Your Profile!</button>
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('content').innerHTML = html;
            
            // Animate the analysis process
            setTimeout(() => {
                document.getElementById('analysis-progress').style.width = '100%';
                document.getElementById('analysis-text').textContent = 'Analyzing communication patterns...';
            }, 100);
            
            setTimeout(() => {
                document.getElementById('analysis-text').textContent = 'Identifying learning preferences...';
            }, 800);
            
            setTimeout(() => {
                document.getElementById('analysis-text').textContent = 'Calculating personality traits...';
            }, 1500);
            
            setTimeout(() => {
                document.getElementById('analysis-text').textContent = 'Generating insights...';
            }, 2200);
            
            setTimeout(() => {
                document.getElementById('analysis-text').textContent = '✅ Analysis complete!';
            }, 2800);
            
            // Show results after animation
            setTimeout(() => {
                document.getElementById('results-content').style.display = 'block';
                document.getElementById('results-content').scrollIntoView({ behavior: 'smooth' });
                
                // Create Big 5 Radar Chart
                const ctx = document.getElementById('personalityRadarChart').getContext('2d');
                new Chart(ctx, {
                    type: 'radar',
                    data: {
                        labels: ['Openness', 'Conscientiousness', 'Extraversion', 'Agreeableness', 'Emotional Stability'],
                        datasets: [{
                            label: 'Your Personality Profile',
                            data: [85, 65, 60, 80, 75], // Would come from backend in production
                            backgroundColor: 'rgba(102, 126, 234, 0.2)',
                            borderColor: 'rgba(102, 126, 234, 1)',
                            borderWidth: 3,
                            pointBackgroundColor: 'rgba(102, 126, 234, 1)',
                            pointBorderColor: '#fff',
                            pointHoverBackgroundColor: '#fff',
                            pointHoverBorderColor: 'rgba(102, 126, 234, 1)',
                            pointRadius: 6,
                            pointHoverRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        scales: {
                            r: {
                                min: 0,
                                max: 100,
                                ticks: {
                                    stepSize: 20,
                                    backdropColor: 'transparent'
                                },
                                grid: {
                                    color: 'rgba(0, 0, 0, 0.1)'
                                },
                                pointLabels: {
                                    font: {
                                        size: 14,
                                        weight: 'bold'
                                    }
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return context.label + ': ' + context.parsed.r + '%';
                                    }
                                }
                            }
                        }
                    }
                });
                
                // Fetch and display assessment history
                fetchAssessmentHistory();
            }, 3500);
        }
        
        async function fetchAssessmentHistory() {
            try {
                // Try with token first, fall back to session-based auth
                const token = localStorage.getItem('token');
                const headers = {};
                
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                    console.log('✅ Using token authentication');
                } else {
                    console.log('⚠️ No token found, trying session-based auth');
                }
                
                const response = await fetch('/api/personality/history?limit=20', {
                    headers: headers,
                    credentials: 'include'  // Include cookies for session auth
                });
                
                if (!response.ok) {
                    console.log('History fetch failed:', response.status);
                    return;
                }
                
                const data = await response.json();
                
                console.log('📊 Assessment history received:', data);
                console.log('   Count:', data.count);
                console.log('   Items:', data.history?.length);
                if (data.history) {
                    data.history.forEach((item, i) => {
                        console.log(`   ${i+1}. ${item.completed_at}: O=${(item.openness*100).toFixed(0)}% C=${(item.conscientiousness*100).toFixed(0)}%`);
                    });
                }
                
                if (data.success && data.history && data.history.length > 1) {
                    // User has multiple assessments - show history chart
                    console.log('✅ Displaying chart with', data.history.length, 'assessments');
                    displayHistoryChart(data.history);
                } else {
                    console.log('⚠️ Not enough history:', data.history?.length || 0, 'items');
                }
            } catch (error) {
                console.error('Error fetching assessment history:', error);
            }
        }
        
        function displayHistoryChart(history) {
            console.log('📈 displayHistoryChart called with', history.length, 'items');
            
            // Show the history chart section
            document.getElementById('history-chart-section').style.display = 'block';
            
            // Sort by date (oldest first)
            history.sort((a, b) => new Date(a.completed_at) - new Date(b.completed_at));
            console.log('   After sort:', history.map(h => h.completed_at));
            
            // Prepare data
            const labels = history.map(h => {
                const date = new Date(h.completed_at);
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            });
            console.log('   Labels:', labels);
            
            const ctx = document.getElementById('personalityHistoryChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Openness',
                            data: history.map(h => h.openness * 100),
                            borderColor: '#9c27b0',
                            backgroundColor: 'rgba(156, 39, 176, 0.1)',
                            tension: 0.4,
                            borderWidth: 2
                        },
                        {
                            label: 'Conscientiousness',
                            data: history.map(h => h.conscientiousness * 100),
                            borderColor: '#2196f3',
                            backgroundColor: 'rgba(33, 150, 243, 0.1)',
                            tension: 0.4,
                            borderWidth: 2
                        },
                        {
                            label: 'Extraversion',
                            data: history.map(h => h.extraversion * 100),
                            borderColor: '#ff9800',
                            backgroundColor: 'rgba(255, 152, 0, 0.1)',
                            tension: 0.4,
                            borderWidth: 2
                        },
                        {
                            label: 'Agreeableness',
                            data: history.map(h => h.agreeableness * 100),
                            borderColor: '#4caf50',
                            backgroundColor: 'rgba(76, 175, 80, 0.1)',
                            tension: 0.4,
                            borderWidth: 2
                        },
                        {
                            label: 'Emotional Stability',
                            data: history.map(h => (1 - h.neuroticism) * 100),
                            borderColor: '#f44336',
                            backgroundColor: 'rgba(244, 67, 54, 0.1)',
                            tension: 0.4,
                            borderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            min: 0,
                            max: 100,
                            ticks: {
                                callback: function(value) {
                                    return value + '%';
                                }
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'bottom'
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.parsed.y.toFixed(1) + '%';
                                }
                            }
                        }
                    }
                }
            });
        }

        async function viewFullProfile() {
            try {
                const response = await fetch(`/personality/profile/${currentUser}`);
                const data = await response.json();
                console.log('Full profile:', data);
                
                // Display full profile (you can enhance this)
                alert('Full profile logged to console. Check developer tools.');
                
            } catch (error) {
                console.error('Error getting profile:', error);
            }
        }

        function goToConversations() {
            // Navigate to chatchat and set tab to conversations
            window.location.href = '/chatchat?tab=chat';
        }

        function goBackToDashboard() {
            // Notify parent window to refresh psychology data
            if (window.opener && !window.opener.closed) {
                try {
                    // Tell parent window to reload psychology data
                    window.opener.postMessage({ type: 'assessment_completed', username: currentUser }, '*');
                } catch (e) {
                    console.log('Could not notify parent window:', e);
                }
            }
            
            // Close window if opened as popup, otherwise navigate to psychology page
            window.close();
            
            // If window.close() didn't work (window not opened by script), navigate to psychology page
            setTimeout(() => {
                window.location.href = '/chatchat?tab=psychology';
            }, 100);
        }

        function goToDashboard() {
            // Navigate to chatchat main dashboard
            window.location.href = '/chatchat';
        }

        async function pauseAssessment() {
            // Save pause state on backend
            try {
                await fetch(`/personality/assessment/pause/${currentUser}`, {
                    method: 'POST'
                });
            } catch (error) {
                console.error('Error pausing assessment:', error);
            }
            
            // Try to close the window
            window.close();
            
            // If window.close() doesn't work (not opened by script), go back
            setTimeout(() => {
                window.history.back();
            }, 100);
        }

        function handleMaybeLater() {
            // Try to close the window
            window.close();
            
            // If window.close() doesn't work, go back
            setTimeout(() => {
                window.history.back();
            }, 100);
        }
    </script>
