<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ character.display_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* ── Calm, quiet space ───────────────────────────────────────────── */
        :root {
            --primary: {{ character.theme.primary_color }};
            --secondary: {{ character.theme.secondary_color }};
            --bg: #F4F1EC;       /* warm off-white */
            --ink: #3A3A3A;
            --ink-soft: #7a7a7a;
            --user-bubble: #E8EFF5;
            --bot-bubble: #FFFFFF;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
        }

        .back-link {
            position: absolute; top: 18px; left: 18px;
            color: var(--ink-soft); text-decoration: none;
            font-size: 0.9rem; opacity: 0.6;
            transition: opacity 0.2s;
        }
        .back-link:hover { opacity: 1; color: var(--ink); }

        .companion-shell {
            max-width: 720px;
            margin: 0 auto;
            padding: 56px 24px 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .companion-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .companion-name {
            font-size: 1.4rem;
            font-weight: 500;
            color: var(--ink);
            margin: 0;
        }
        .companion-sub {
            font-size: 0.9rem;
            color: var(--ink-soft);
            margin-top: 4px;
            font-weight: 400;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0 16px;
            scroll-behavior: smooth;
        }
        .chat-area::-webkit-scrollbar { width: 6px; }
        .chat-area::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); border-radius: 3px; }

        .msg {
            display: flex;
            margin-bottom: 14px;
            animation: settle 0.35s ease;
        }
        @keyframes settle {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg.user { justify-content: flex-end; }
        .msg.bot  { justify-content: flex-start; }

        .bubble {
            max-width: 78%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.98rem;
            line-height: 1.55;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .msg.user .bubble {
            background: var(--user-bubble);
            color: var(--ink);
            border-bottom-right-radius: 6px;
        }
        .msg.bot .bubble {
            background: var(--bot-bubble);
            color: var(--ink);
            border-bottom-left-radius: 6px;
        }

        /* Typing dots — soft */
        .typing {
            display: none;
            padding: 6px 16px 14px;
        }
        .typing.show { display: block; }
        .typing span {
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--ink-soft);
            margin: 0 2px;
            opacity: 0.4;
            animation: dot 1.3s infinite ease-in-out;
        }
        .typing span:nth-child(2) { animation-delay: 0.18s; }
        .typing span:nth-child(3) { animation-delay: 0.36s; }
        @keyframes dot {
            0%, 80%, 100% { transform: scale(0.7); opacity: 0.3; }
            40% { transform: scale(1); opacity: 0.7; }
        }

        /* Input — soft, almost invisible */
        .input-wrap {
            padding-top: 12px;
            border-top: 1px solid rgba(0,0,0,0.06);
        }
        .input-row {
            display: flex;
            align-items: center;
            background: #fff;
            border-radius: 24px;
            padding: 6px 6px 6px 18px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .input-row input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 1rem;
            color: var(--ink);
            padding: 10px 4px;
        }
        .input-row input::placeholder { color: var(--ink-soft); opacity: 0.7; }
        .send-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .send-btn:hover { opacity: 0.85; }
        .send-btn:active { transform: scale(0.95); }
        .send-btn:disabled { opacity: 0.3; cursor: default; }

        /* Quiet starter chips — only shown when there's nothing else */
        .starters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 18px;
        }
        .starter-chip {
            background: transparent;
            color: var(--ink-soft);
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 999px;
            padding: 7px 14px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .starter-chip:hover {
            color: var(--primary);
            border-color: var(--primary);
            background: rgba(126, 156, 184, 0.06);
        }
        .starters.hidden { display: none; }

        /* Hide noisy elements that other characters use */
        .sidebar, .daily-insight-card, .stats-card, .quick-topics-sidebar { display: none !important; }
    </style>
</head>
<body>
    <a href="/chatchat" class="back-link"><i class="fas fa-arrow-left"></i> back</a>

    <div class="companion-shell">
        <div class="companion-header">
            <h1 class="companion-name">{{ character.display_name }}</h1>
            <div class="companion-sub">{{ character.tagline }}</div>
        </div>

        <div class="chat-area" id="chatMessages">
            <div class="msg bot">
                <div class="bubble">Hey. Glad you're here. No agenda — just here if you feel like talking.</div>
            </div>

            <!-- Soft starter chips, hidden once the conversation begins -->
            <div class="starters" id="starters">
                {% for topic in character.quick_topics %}
                <button class="starter-chip" onclick="sendQuickMessage('{{ topic.message|e }}')">{{ topic.label }}</button>
                {% endfor %}
            </div>
        </div>

        <div class="typing" id="typingIndicator"><span></span><span></span><span></span></div>

        <div class="input-wrap">
            <div class="input-row">
                <input
                    type="text"
                    id="userInput"
                    placeholder="Whatever's on your mind…"
                    autocomplete="off"
                    onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="send-btn" id="send-btn" onclick="sendMessage()" aria-label="Send">
                    <i class="fas fa-arrow-up"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='auth_helper.js') }}"></script>
    <script>
        const characterId = "{{ character_id }}";
        let sessionId = null;

        // Bounce to login if no token
        if (!AuthHelper.isAuthenticated()) {
            window.location.href = '/user_logon';
        }

        // Helpers
        function getCookie(name) {
            const v = `; ${document.cookie}`;
            const parts = v.split(`; ${name}=`);
            return parts.length === 2 ? parts.pop().split(';').shift() : null;
        }
        function setCookie(name, value, days = 365) {
            const e = new Date(); e.setTime(e.getTime() + days * 86400000);
            document.cookie = `${name}=${value};expires=${e.toUTCString()};path=/`;
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function addMessage(content, role) {
            const wrap = document.createElement('div');
            wrap.className = `msg ${role === 'user' ? 'user' : 'bot'}`;
            const bub = document.createElement('div');
            bub.className = 'bubble';
            bub.innerHTML = escapeHtml(content).replace(/\n/g, '<br>');
            wrap.appendChild(bub);

            const chat = document.getElementById('chatMessages');
            chat.appendChild(wrap);
            chat.scrollTop = chat.scrollHeight;

            // Hide starters after first user message
            if (role === 'user') {
                const s = document.getElementById('starters');
                if (s) s.classList.add('hidden');
            }
        }

        function sendQuickMessage(msg) {
            document.getElementById('userInput').value = msg;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            input.value = '';

            const typing = document.getElementById('typingIndicator');
            typing.classList.add('show');

            try {
                const r = await AuthHelper.authenticatedFetch(`/${characterId}/chat`, {
                    method: 'POST',
                    body: JSON.stringify({ message, session_id: sessionId })
                });
                if (r.status === 401 || r.status === 403) {
                    window.location.href = '/user_logon';
                    return;
                }
                const data = await r.json();
                typing.classList.remove('show');

                if (data.session_id) {
                    sessionId = data.session_id;
                    setCookie(`session_${characterId}`, sessionId);
                }

                if (data.response) {
                    addMessage(data.response, 'bot');
                } else if (data.error) {
                    addMessage("Hmm, something hiccupped on my end. Try again?", 'bot');
                }
            } catch (e) {
                typing.classList.remove('show');
                addMessage("Hmm, something hiccupped on my end. Try again?", 'bot');
                console.error(e);
            }
        }

        // Restore session if exists, but don't show progress/counters
        async function loadHistory() {
            sessionId = getCookie(`session_${characterId}`);
            if (!sessionId) return;
            try {
                const r = await AuthHelper.authenticatedFetch(
                    `/${characterId}/history?session_id=${sessionId}`
                );
                if (!r.ok) return;
                const data = await r.json();
                if (data && data.messages && data.messages.length > 0) {
                    // Replace the default greeting with restored conversation
                    const chat = document.getElementById('chatMessages');
                    chat.innerHTML = '';
                    document.getElementById('starters')?.remove();
                    for (const m of data.messages) {
                        addMessage(m.content || m.message || '', m.role === 'user' ? 'user' : 'bot');
                    }
                }
            } catch (e) {
                console.warn('history load failed (ok)', e);
            }
        }

        window.addEventListener('load', loadHistory);
        document.getElementById('userInput').focus();
    </script>
</body>
</html>
