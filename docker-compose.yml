version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-model-compare
    restart: always
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - DATABASE_PATH=/app/databases/production_integrated_users.db
      - SMART_RESPONSE_DB=/app/databases/production_smart_response.db
      - LOG_LEVEL=INFO
    volumes:
      # Persist databases
      - ./databases:/app/databases
      # Persist logs
      - ./logs:/app/logs
      # Persist conversations (legacy)
      - ./conversations:/app/conversations
      # Persist user profiles
      - ./user_profiles:/app/user_profiles
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: ai-model-compare-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx configuration
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Static files (read-only)
      - ./static:/app/static:ro
      # SSL certificates (Let's Encrypt)
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      # Nginx logs
      - ./logs/nginx:/var/log/nginx
    networks:
      - ai-network
    depends_on:
      - app

  # Optional: Certbot for SSL renewal
  certbot:
    image: certbot/certbot
    container_name: ai-model-compare-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge

volumes:
  databases:
  logs:
  conversations:
  user_profiles:
